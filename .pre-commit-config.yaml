# hook 一律用 local + `uv run --frozen`，不用各工具的官方 mirror repo。
# 理由是版本一致性：mirror repo 的 rev 与 uv.lock 里的版本是两套独立的真相，
# 迟早出现「本地过了 CI 没过」。走 --frozen 之后 hook 与 CI 用的是同一份锁定版本。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 语料与模型权重绝不能混进 git；这一条是最后一道机械防线。
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        # --exit-non-zero-on-fix：自动修完仍然失败，避免「改过了但没人看见」
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: uv-lock-check
        name: uv lock --check
        # 改了 pyproject 却忘了重新 lock，是 CI 上最常见的一类假失败。
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
