[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# PEP 621 元数据
# ============================================================================
[project]
name = "citequest"
version = "0.1.0"
description = "面向计算机论文的学术检索与 RAG 系统：混合检索 + 论文级聚合 + 可验证引用"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "CiteQuest" }]
keywords = ["retrieval", "rag", "milvus", "hybrid-search", "academic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Root development dependencies. Production images use their role-specific
# locked requirements referenced by deploy/core/Dockerfile and runtime/.
dependencies = [
    # --- 向量库。2.6 是硬底线：TEI Embedding Function 官方标注 compatible with 2.6.x ---
    "pymilvus>=2.6.0,<2.7",
    # --- 服务层 ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sse-starlette>=2.1,<3.0",
    "httpx>=0.27,<1.0",
    # --- Configuration ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # --- LangGraph workflows ---
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<2.0",
    # --- Official MCP Python SDK ---
    "mcp>=1.9,<2.0",
    # --- 可观测 ---
    "structlog>=24.4",
    "python-ulid>=3.0",
    "prometheus-client>=0.21",
    # --- Offline tabular data processing ---
    "duckdb>=1.1",
    "pyarrow>=17.0",
    # --- CLI ---
    "typer>=0.15,<1.0",
]

[project.optional-dependencies]
# 本地模型栈：reranker（bge-reranker-v2-m3）、HHEM、离线 BGE-M3。
# 在线 dense 编码**不在这里**——那条路走 TEI + Milvus Function，客户端不做 embedding。
models = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.1",
]
# 离线建库：解析 unarXive tar.xz、拉 OpenAlex、写 parquet。
ingest = [
    "datasets>=3.0",
    "tqdm>=4.66",
    "orjson>=3.10",
]

[project.scripts]
# Web service CLI; operational lifecycle commands remain in python tools/cq.py.
citequest = "citequest.web_v3.main:main"

# ============================================================================
# PEP 735 依赖组：dev 与 eval 分开，避免评测专用依赖污染主依赖
# ============================================================================
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
eval = [
    "ranx>=0.3.20",
    "datasets>=3.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev"]

# ============================================================================
# 打包：src layout
# ============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/citequest"]

# ============================================================================
# ruff：lint 与 format 配置集中在 pyproject，不散落 setup.cfg
# ============================================================================
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RUF",  # ruff 自有规则（含中文标点相关的 RUF001/002/003）
    "ANN",  # 类型注解齐全
    "T20",  # 禁止 print，输出一律走结构化日志
]
ignore = [
    "ANN401",  # 允许 **kwargs: Any
    "E501",    # 行宽由 formatter 管；中文注释按视觉宽度算会被误判
    # 中文注释里必然出现全角标点，RUF001/002/003 会把它们全部报成 ambiguous unicode。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert 与较松的注解要求。
"tests/**" = ["ANN", "S101"]
# 包 __init__.py 的职责就是再导出，F401 是预期行为。
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["citequest"]

[tool.ruff.format]
docstring-code-format = true

# ============================================================================
# mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
files = ["src/citequest"]
strict = true
warn_unreachable = true
# 第三方库的存根覆盖参差不齐，缺存根不该让整个类型检查失败。
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "langgraph.*", "mcp.*", "ranx.*", "sentence_transformers.*", "FlagEmbedding.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests/v3", "tests/v2/unit"]
# src layout 下 pytest 官方推荐 importlib 模式：测试跑的是**安装后的包**，
# 而不是仓库里那份源码副本，打包错误才会在测试阶段就暴露。
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "auto"
markers = [
    "integration: 需要本地 Milvus / TEI 才能跑，CI 上默认跳过",
    "e2e: 打 FastAPI TestClient 的全链路测试（含 SSE）",
    "slow: 单条耗时超过数秒",
]

[tool.coverage.run]
source = ["src/citequest"]
branch = true
