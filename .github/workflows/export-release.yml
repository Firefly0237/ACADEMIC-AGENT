name: Export release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new actual candidate, or certify an existing candidate
        type: choice
        required: true
        options: [build, certify]
      candidate_run_id:
        description: Successful build workflow run ID (certify only)
        type: string
      certification_path:
        description: Repository-relative actual certification JSON (certify only)
        type: string
      certification_sha256:
        description: Exact certification file SHA-256 (certify only)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: export-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.operation == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual renderer and produce physical capacity artifacts
        run: python scripts/s13/build_release.py build --output output/export-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-candidate
          path: output/export-candidate
          if-no-files-found: error
          retention-days: 14

  certify:
    if: inputs.operation == 'certify'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: export-candidate
          path: output/export-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Bind actual certification and assemble matching release
        env:
          CERTIFICATION_PATH: ${{ inputs.certification_path }}
          CERTIFICATION_SHA256: ${{ inputs.certification_sha256 }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, sys
          root = pathlib.Path.cwd().resolve()
          path = pathlib.Path(os.environ['CERTIFICATION_PATH'])
          if path.is_absolute() or '..' in path.parts:
              raise SystemExit('repository-relative certification required')
          actual = (root / path).resolve(strict=True)
          if not actual.is_relative_to(root) or (root / path).is_symlink():
              raise SystemExit('certification must stay in the checked-out repository')
          sha = os.environ['CERTIFICATION_SHA256']
          if re.fullmatch('[a-f0-9]{64}', sha) is None:
              raise SystemExit('exact certification SHA-256 required')
          subprocess.run([sys.executable, 'scripts/s13/build_release.py', 'certify',
              '--candidate', 'output/export-candidate', '--certification', str(actual),
              '--certification-sha256', sha, '--output', 'output/export-release'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: export-release
          path: output/export-release
          if-no-files-found: error
          retention-days: 30
