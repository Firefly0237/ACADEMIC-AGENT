[project]
name = "citequest-s04-linux-cpu-v2"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.146.0", "docling-core==2.105.0", "pypdf==6.21.4", "pypdfium2==5.14.0",
  "torch==2.15.0", "torchvision==0.29.2+cpu", "filetype==1.2.0", "psutil==7.2.2", "defusedxml==0.7.1",
  "langchain-core==1.7.4", "langchain-text-splitters==1.1.3", "tokenizers==0.23.3",
  "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8", "jsonschema[format]==4.26.0",
  "docker==7.2.0", "pytest==9.2.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
