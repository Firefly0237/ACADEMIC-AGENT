[project]
name = "citequest-server-web"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary,pool]==3.3.8",
  "fastapi==0.162.0", "pydantic==2.14.2", "uvicorn==0.54.0", "pydantic-settings==2.16.2",
  "jsonschema[format]==4.26.0", "httpx==0.28.1", "httpx2==2.16.0",
  "authlib==1.9.4", "itsdangerous==2.2.0", "pytest==9.2.0",
  "defusedxml==0.7.1", "pymilvus==2.6.17",
  "langchain-core==1.7.4", "langchain-text-splitters==1.1.3", "tokenizers==0.23.3",
  "langgraph==1.2.19", "langgraph-checkpoint-postgres==3.2.0",
  "google-cloud-storage==3.17.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-binary-package = ["sqlalchemy"]
