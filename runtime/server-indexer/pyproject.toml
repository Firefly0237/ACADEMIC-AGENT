[project]
name = "citequest-server-indexer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8",
  "fastapi==0.162.0", "pydantic==2.14.2", "pydantic-settings==2.16.2", "uvicorn==0.54.0",
  "jsonschema[format]==4.26.0", "httpx==0.28.1", "httpx2==2.16.0", "pytest==9.2.0",
  "langchain-core==1.7.4", "langchain-text-splitters==1.1.3", "tokenizers==0.23.3",
  "psutil==7.2.2", "defusedxml==0.7.1",
  "filelock==4.2.9", "httpcore==1.0.9", "anyio==4.16.0", "apscheduler==3.11.3",
  "pymilvus==2.6.17", "pandas==3.1.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
no-binary-package = ["sqlalchemy"]
