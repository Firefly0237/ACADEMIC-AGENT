[project]
name = "citequest-s04-app"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8",
  "fastapi==0.162.0", "pydantic==2.14.2", "pydantic-settings==2.16.2", "uvicorn==0.54.0",
  "jsonschema[format]==4.26.0", "httpx==0.28.1", "httpx2==2.16.0", "pytest==9.2.0",
  "langchain-core==1.7.4", "langchain-text-splitters==1.1.3", "tokenizers==0.23.3",
  "psutil==7.2.2", "pywin32==312", "defusedxml==0.7.1",
]

[dependency-groups]
dev = ["uv==0.9.5"]

[tool.uv]
environments = ["sys_platform == 'win32'"]
no-binary-package = ["sqlalchemy"]

[tool.pytest.ini_options]
pythonpath = ["../../src"]
testpaths = ["../../tests/v2"]
cache_dir = "../../data/runtime-s04-app/pytest-cache"
