[project]
name = "citequest-s05-native-index"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8",
  "pydantic==2.14.2", "pydantic-settings==2.16.2", "pymilvus==2.6.17", "pandas==3.1.0", "httpx==0.28.1",
  "tokenizers==0.23.3", "langchain-core==1.7.4", "langchain-text-splitters==1.1.3",
  "jsonschema[format]==4.26.0", "psutil==7.2.2", "pywin32==312", "pytest==9.2.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]
no-binary-package = ["sqlalchemy"]

[tool.pytest.ini_options]
pythonpath = ["../../src"]
testpaths = ["../../tests/v2"]
cache_dir = "pytest-cache"
